<link rel="manifest" href="manifest.json">

<title>The Hampton Edit — Home Build Journal</title>
<style>
:root{--ink:#263c4a;--muted:#74858b;--navy:#294b60;--navy-dark:#203d50;--sea:#dcebe7;--sea-deep:#9fc8c5;--sky:#dcecf1;--sand:#f0e6d7;--paper:#f8f7f2;--white:#fffefa;--line:#e5e5dd;--gold:#b69a6a;--coral:#f2e1d9;--green:#dcebe1;--red:#f6e4df;--shadow:0 8px 26px rgba(40,65,78,.07);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9fc8c5;outline-offset:2px}a{color:var(--navy)}.app{max-width:850px;margin:0 auto;min-height:100dvh;padding-bottom:100px}.top{padding:20px 20px 25px;background:linear-gradient(140deg,#f5f2e9 0%,#e5f0ed 55%,#e3eef2 100%);border-bottom:1px solid #e2e7e2;position:relative;overflow:hidden}.top:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(41,75,96,.1);border-radius:50%;right:-95px;top:-105px;box-shadow:0 0 0 24px rgba(255,255,255,.14),0 0 0 48px rgba(255,255,255,.1);pointer-events:none}.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.logo{height:48px;width:48px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 5px 14px #294b6024}.logo svg{width:31px;height:31px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--muted);font-weight:800}.top h1{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:500;letter-spacing:-.5px;margin:2px 0 0;color:var(--navy-dark)}.greeting{position:relative;z-index:1;margin-top:23px;color:#647981;font-size:13px}.greeting strong{display:block;color:var(--navy-dark);font:500 27px/1.15 Georgia,"Times New Roman",serif;margin-top:5px;letter-spacing:-.45px}.tagline{margin:8px 0 0;max-width:480px;font-size:13px;color:#60767c}.content{padding:20px 16px}.view-title{font:500 28px/1.15 Georgia,"Times New Roman",serif;margin:2px 4px 8px;color:var(--navy-dark);letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin:0 4px 19px;line-height:1.5}.hero{background:linear-gradient(125deg,var(--navy) 0%,#38677b 100%);color:white;border-radius:25px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff22;border-radius:50%;right:-52px;top:-65px;box-shadow:0 0 0 20px #ffffff09,0 0 0 40px #ffffff07}.hero .eyebrow{color:#d0e5e2}.hero h2{font:500 26px/1.2 Georgia,"Times New Roman",serif;margin:9px 0 7px;position:relative;z-index:1}.hero p{color:#e0eceb;margin:0;font-size:13px;line-height:1.55;max-width:520px;position:relative;z-index:1}.progress-track{height:7px;border-radius:20px;background:#ffffff35;margin:19px 0 8px;overflow:hidden;position:relative;z-index:1}.progress-fill{height:100%;background:#e5d4ad;border-radius:20px;transition:width .2s}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#eaf2ef;position:relative;z-index:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}.stat,.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.stat .icon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:var(--sea);color:var(--navy);font-size:17px;margin-bottom:12px}.stat:nth-child(2) .icon{background:var(--sand)}.stat:nth-child(3) .icon{background:var(--sky)}.stat:nth-child(4) .icon{background:var(--coral)}.stat .label{color:var(--muted);font-size:11px;line-height:1.35}.stat .value{font-size:clamp(18px,4vw,23px);font-weight:750;letter-spacing:-.5px;margin-top:5px;overflow-wrap:anywhere;color:var(--navy-dark)}.stat .note{font-size:11px;color:var(--muted);margin-top:5px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 3px 11px}.section-head h3{margin:0;font:500 20px Georgia,"Times New Roman",serif;color:var(--navy-dark)}.text-btn{border:0;background:none;color:var(--navy);font-weight:750;padding:8px}.row-item{display:flex;gap:11px;align-items:center;background:var(--white);border:1px solid var(--line);padding:13px;border-radius:16px;margin-bottom:8px;box-shadow:0 3px 12px #294b6006}.row-item .item-main{flex:1;min-width:0}.row-item strong{display:block;font-size:13px;line-height:1.4}.row-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.45;overflow-wrap:anywhere}.amount{font-weight:750;white-space:nowrap;font-size:12px;color:var(--navy-dark)}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#f0eee7;color:#65747a;font-size:10px;font-weight:750;white-space:nowrap}.pill.done{background:var(--green);color:#35634f}.pill.high{background:#f4e7cf;color:#87652d}.pill.overdue{background:var(--red);color:#9a5143}.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 8px max(10px,env(safe-area-inset-bottom));background:#fffefaf0;backdrop-filter:blur(18px);border-top:1px solid #e4e5de;display:flex;justify-content:center}.nav-inner{width:100%;max-width:850px;display:flex;justify-content:space-around;gap:4px}.nav-btn{border:0;background:transparent;color:#839196;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px;padding:7px 10px;border-radius:14px;flex:1}.nav-btn .nav-icon{font-size:19px;line-height:1}.nav-btn.active{color:var(--navy);background:#e5efeb}.primary{border:0;background:var(--navy);color:white;font-weight:750;padding:13px 16px;border-radius:14px;width:100%;box-shadow:0 4px 10px #294b601c}.primary:active{background:var(--navy-dark)}.secondary{border:1px solid #dfe3dc;background:#fffefa;color:var(--navy);font-weight:700;padding:11px 13px;border-radius:13px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 13px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{border:1px solid var(--line);background:var(--white);border-radius:30px;padding:8px 12px;font-size:11px;white-space:nowrap;color:#62767c}.filter.active{background:var(--navy);border-color:var(--navy);color:white}.empty{padding:27px 16px;text-align:center;color:var(--muted);font-size:13px;background:var(--white);border:1px dashed #cdd9d5;border-radius:17px}.empty strong{display:block;color:var(--navy-dark);font:500 18px Georgia,serif;margin-bottom:5px}.selection-swatch{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#f1e9da,#dcebe7);display:grid;place-items:center;font-size:18px;flex-shrink:0;color:var(--navy)}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--white);margin-bottom:12px;outline-color:var(--sea-deep)}.card{margin-bottom:12px}.card h3{margin:0 0 10px;font:500 19px Georgia,serif;color:var(--navy-dark)}.budget-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:11px 0;border-bottom:1px solid var(--line)}.budget-line:last-child{border:0}.budget-line span:first-child{color:#62767c}.form-label{display:block;font-size:11px;color:#526a73;font-weight:800;margin:13px 0 6px}.field{width:100%;padding:12px;border:1px solid #dce3dd;border-radius:12px;background:#fffefa;color:var(--ink);outline-color:var(--sea-deep)}textarea.field{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-back{position:fixed;inset:0;background:#203d50a8;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);border-radius:25px 25px 0 0;width:100%;max-width:620px;max-height:92dvh;overflow:auto;padding:23px 20px max(24px,env(safe-area-inset-bottom))}.modal h2{margin:0 0 5px;font:500 24px Georgia,serif;color:var(--navy-dark)}.modal .hint{color:var(--muted);font-size:13px;margin:0 0 15px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.tiny{font-size:11px;color:var(--muted);line-height:1.55}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.danger{color:#a34f42;border-color:#efd6d0}.toast{position:fixed;z-index:40;bottom:102px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:11px 16px;border-radius:13px;font-size:12px;box-shadow:var(--shadow);max-width:90%;text-align:center}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.settings-row:last-of-type{border-bottom:0}.settings-row strong{font-size:13px}.settings-row p{margin:4px 0 0;color:var(--muted);font-size:11px}.hidden{display:none!important}.soft-banner{background:linear-gradient(110deg,#e5efeb,#f3ecdf);border:1px solid #e2e6dc;border-radius:17px;padding:15px;margin-top:14px;color:#526a73;font-size:12px}.soft-banner strong{display:block;color:var(--navy-dark);font:500 17px Georgia,serif;margin-bottom:4px}.swatch-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:5px}@media(min-width:600px){.content{padding:25px 24px}.top{padding:26px 28px 30px}.modal-back{align-items:center}.modal{border-radius:25px;padding-bottom:24px}.hero{padding:27px}.stat{padding:19px}.top h1{font-size:28px}.greeting strong{font-size:31px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M5 18.5 20 6l15 12.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 17v16h20V17M16 33V22h8v11" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 36c5-2 9-2 14 0s9 2 18-1" stroke="#d9c49a" stroke-width="1.7" stroke-linecap="round"/></svg></div><div><div class="eyebrow">A coastal home journal</div><h1>The Hampton Edit</h1></div></div>
 <div class="greeting">A little coastal calm for the build.<strong id="projectNameDisplay">Our Coastal Home</strong></div>
 <p class="tagline">Thoughtful choices, clear plans and all the little details that make a house feel like home.</p>
</header>
<main id="main" class="content"></main>
</div>
<nav class="bottom-nav"><div class="nav-inner" id="nav"></div></nav><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
const STORE='homebuild-companion-v1';
const defaults={projectName:'The Hampton House',landCost:562000,builderCost:370405,upgradeBudget:15000,otherBudget:2500,buildStage:'Planning & selections',tasks:[],selections:[],expenses:[],documents:[],notes:''};
let data,view='Home',taskFilter='All',selectionFilter='All',selectionSearch='';
function load(){try{const saved=JSON.parse(localStorage.getItem(STORE));data=saved&&saved.version===1?saved.data:structuredClone(defaults)}catch(e){data=JSON.parse(JSON.stringify(defaults))}['tasks','selections','expenses','documents'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});if(typeof data.notes!=='string')data.notes='';if(data.projectName==="Rigby's Home"||data.projectName==='Our Coastal Home'||data.projectName==='Our New Home'){data.projectName='The Hampton House';save();}}
function save(){localStorage.setItem(STORE,JSON.stringify({version:1,data}));}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number(n)||0)}
function fmtDate(d){if(!d)return 'No date set';return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function nextId(arr){return Math.max(0,...arr.map(x=>Number(x.id)||0))+1}function tasksOpen(){return data.tasks.filter(t=>t.status!=='Done').length}function budgetTotal(){return ['landCost','builderCost','upgradeBudget','otherBudget'].reduce((n,k)=>n+Number(data[k]||0),0)}function expensesTotal(){return data.expenses.reduce((a,e)=>a+Number(e.amount||0),0)}
function toast(msg){const el=document.getElementById('toastRoot');el.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>el.innerHTML='',2500)}
const navItems=[['Home','⌂'],['Budget','$'],['Selections','◇'],['Tasks','✓'],['More','•••']];
function navRender(){document.getElementById('nav').innerHTML=navItems.map(([n,i])=>`<button class="nav-btn ${view===n?'active':''}" onclick="go('${n}')"><span class="nav-icon">${i}</span>${n}</button>`).join('')}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){navRender();const m=document.getElementById('main');if(view==='Home')m.innerHTML=homeView();else if(view==='Budget')m.innerHTML=budgetView();else if(view==='Selections')m.innerHTML=selectionsView();else if(view==='Tasks')m.innerHTML=tasksView();else m.innerHTML=moreView();document.getElementById('projectNameDisplay').textContent=data.projectName||'The Hampton House'}
function homeView(){const done=data.tasks.filter(t=>t.status==='Done').length,pct=data.tasks.length?Math.round(done/data.tasks.length*100):0,upcoming=data.tasks.filter(t=>t.status!=='Done').slice(0,3);return `<section class="hero"><div class="eyebrow">YOUR BUILD, BEAUTIFULLY ORGANISED</div><h2>A home with room to breathe.</h2><p>Keep your budget, finish choices and next steps in one calm, coastal-inspired place.</p><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-meta"><span>${done} of ${data.tasks.length} tasks completed</span><strong>${pct}%</strong></div></section><div class="grid"><div class="stat"><div class="icon">⌂</div><div class="label">Estimated project budget</div><div class="value">${money(budgetTotal())}</div><div class="note">Land, build & allowances</div></div><div class="stat"><div class="icon">＄</div><div class="label">Expenses recorded</div><div class="value">${money(expensesTotal())}</div><div class="note">${data.expenses.length} recorded payments</div></div><div class="stat"><div class="icon">✓</div><div class="label">Open tasks</div><div class="value">${tasksOpen()}</div><div class="note">Your next little steps</div></div><div class="stat"><div class="icon">◇</div><div class="label">Selections tracked</div><div class="value">${data.selections.length}</div><div class="note">${data.selections.filter(s=>s.status==='Confirmed').length} confirmed so far</div></div></div><div class="section-head"><h3>On the list</h3><button class="text-btn" onclick="go('Tasks')">All tasks →</button></div>${upcoming.length?upcoming.map(taskRow).join(''):'<div class="empty"><strong>Nothing pressing right now</strong>Add a task when your next decision comes along.</div>'}<div class="section-head"><h3>Make a little progress</h3></div><div class="grid"><button class="secondary" onclick="openTask()">＋ Add a task</button><button class="secondary" onclick="openExpense()">＋ Record expense</button><button class="secondary" onclick="openSelection()">＋ Add a selection</button><button class="secondary" onclick="go('More')">▤ Notes & documents</button></div><div class="soft-banner"><strong><span class="swatch-dot"></span>Coastal palette, considered choices.</strong>A place to bring together the whites, natural oak, soft stone and sea-glass tones of your future home.</div><p class="tiny" style="margin:16px 4px 0">Your information is saved in this browser on this device. Visit More → Backup to export a copy.</p>`}
function taskRow(t){const p=t.priority==='High'?'<span class="pill high">High priority</span>':`<span class="pill ${t.status==='Done'?'done':''}">${esc(t.status)}</span>`;return `<div class="row-item"><button aria-label="Mark task done" style="border:1.5px solid #b7cbc6;background:${t.status==='Done'?'#294b60':'white'};color:white;border-radius:50%;width:25px;height:25px;flex-shrink:0" onclick="toggleTask(${Number(t.id)})">${t.status==='Done'?'✓':''}</button><div class="item-main" onclick="openTask(${Number(t.id)})"><strong style="${t.status==='Done'?'text-decoration:line-through;color:#819096':''}">${esc(t.title)}</strong><small>${t.due?'Due '+fmtDate(t.due)+' · ':''}${esc(t.status)}${t.notes?' · '+esc(t.notes):''}</small></div>${p}</div>`}
function budgetView(){const total=budgetTotal(),paid=expensesTotal(),items=[['Land',data.landCost],['Builder contract',data.builderCost],['Upgrades & variations allowance',data.upgradeBudget],['Other costs allowance',data.otherBudget]];return `<h2 class="view-title">The budget</h2><p class="sub">A clear view of the big picture, with room for the little extras.</p><div class="hero"><div class="eyebrow">ESTIMATED TOTAL PROJECT BUDGET</div><h2>${money(total)}</h2><p>Expenses recorded: ${money(paid)} · Difference against estimate: ${money(total-paid)}</p></div><div class="section-head"><h3>Budget breakdown</h3><button class="text-btn" onclick="openBudget()">Edit</button></div><div class="card">${items.map(([n,v])=>`<div class="budget-line"><span>${esc(n)}</span><strong>${money(v)}</strong></div>`).join('')}<div class="budget-line"><strong>Total estimate</strong><strong>${money(total)}</strong></div></div><div class="section-head"><h3>Recorded expenses</h3><button class="text-btn" onclick="openExpense()">＋ Add</button></div>${data.expenses.length?data.expenses.slice().reverse().map(e=>`<div class="row-item"><div class="selection-swatch">＄</div><div class="item-main"><strong>${esc(e.title)}</strong><small>${esc(e.category)} · ${e.date?fmtDate(e.date):'Date not set'}${e.notes?' · '+esc(e.notes):''}</small></div><div class="amount">${money(e.amount)}</div><button class="text-btn" aria-label="Edit expense" onclick="openExpense(${Number(e.id)})">···</button></div>`).join(''):'<div class="empty"><strong>No expenses logged yet</strong>Add deposits, invoices and payments as you go.</div>'}<p class="tiny">Budget figures are editable estimates. Recorded expenses are not automatically reconciled against your budget.</p>`}
function selectionsView(){const cats=['All',...new Set(data.selections.map(s=>s.category).filter(Boolean))];const shown=data.selections.filter(s=>(selectionFilter==='All'||s.category===selectionFilter)&&(`${s.category} ${s.choice} ${s.area} ${s.notes}`.toLowerCase().includes(selectionSearch.toLowerCase())));return `<h2 class="view-title">The selections edit</h2><p class="sub">Your palette of finishes, fixtures and details — collected in one place.</p><input class="search" placeholder="Search finishes, rooms or notes…" value="${esc(selectionSearch)}" oninput="selectionSearch=this.value;const p=this.selectionStart;render();const n=document.querySelector('.search');n.focus();n.setSelectionRange(p,p)"><div class="filters">${cats.map(c=>`<button class="filter ${selectionFilter===c?'active':''}" onclick="selectionFilter='${esc(c).replace(/'/g,"\\'")}';render()">${esc(c)}</button>`).join('')}</div>${shown.map(s=>`<div class="row-item"><div class="selection-swatch">◇</div><div class="item-main"><strong>${esc(s.category)} · ${esc(s.choice)}</strong><small>${esc(s.area||'General')}${s.notes?' · '+esc(s.notes):''}</small><span class="pill ${s.status==='Confirmed'?'done':''}" style="margin-top:7px">${esc(s.status)}</span></div><button class="text-btn" onclick="openSelection(${Number(s.id)})">Edit</button></div>`).join('')||'<div class="empty"><strong>No selections found</strong>Try another search or add a finish to your collection.</div>'}<button class="primary" onclick="openSelection()" style="margin-top:10px">＋ Add a selection</button>`}
function tasksView(){const fs=['All','To do','In progress','Done'];const shown=data.tasks.filter(t=>taskFilter==='All'||t.status===taskFilter).sort((a,b)=>(a.status==='Done')-(b.status==='Done'));return `<h2 class="view-title">The to-do list</h2><p class="sub">Builder questions, decisions and deadlines — one step at a time.</p><div class="filters">${fs.map(f=>`<button class="filter ${taskFilter===f?'active':''}" onclick="taskFilter='${f}';render()">${f}</button>`).join('')}</div>${shown.map(taskRow).join('')||'<div class="empty"><strong>A clear stretch of coastline</strong>Nothing in this list yet. Add a task whenever something comes up.</div>'}<button class="primary" onclick="openTask()" style="margin-top:10px">＋ Add task</button>`}
function moreView(){return `<h2 class="view-title">Project & backups</h2><p class="sub">The practical details that keep your home journey running smoothly.</p><div class="card"><h3>Project details</h3><label class="form-label">Project name</label><input class="field" id="projectName" value="${esc(data.projectName)}" maxlength="70"><label class="form-label">Current stage</label><select class="field" id="buildStage">${['Planning & selections','Contracts','Pre-construction','Construction','Handover','Complete'].map(x=>`<option ${data.buildStage===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" style="margin-top:14px" onclick="saveProject()">Save project details</button></div><div class="section-head"><h3>Project journal</h3></div><div class="card"><textarea class="field" id="projectNotes" placeholder="Site notes, questions, ideas, phone call summaries…">${esc(data.notes||'')}</textarea><button class="primary" style="margin-top:10px" onclick="saveNotes()">Save notes</button></div><div class="section-head"><h3>Documents & links</h3><button class="text-btn" onclick="openDocument()">＋ Add</button></div>${data.documents.length?data.documents.map(d=>`<div class="row-item"><div class="selection-swatch">▤</div><div class="item-main"><strong>${esc(d.title)}</strong><small>${esc(d.kind||'Link or note')}${d.notes?' · '+esc(d.notes):''}</small>${d.url?`<small><a href="${esc(d.url)}" target="_blank" rel="noopener">Open link ↗</a></small>`:''}</div><button class="text-btn" onclick="openDocument(${Number(d.id)})">Edit</button></div>`).join(''):'<div class="empty"><strong>No references saved yet</strong>Add cloud file links, quotes or useful notes. This app does not upload files.</div>'}<div class="section-head"><h3>Data & backups</h3></div><div class="card"><div class="settings-row"><div><strong>Export a backup</strong><p>Save your project data as a JSON file.</p></div><button class="secondary" onclick="exportData()">Export</button></div><div class="settings-row"><div><strong>Import a backup</strong><p>Restore a HomeBuild Companion JSON backup.</p></div><button class="secondary" onclick="document.getElementById('importFile').click()">Import</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"></div><div class="settings-row"><div><strong>Reset project data</strong><p>Replace this browser's saved data with an empty project.</p></div><button class="secondary danger" onclick="resetData()">Reset</button></div><p class="tiny">Your data stays in this browser's local storage. It does not sync automatically to other devices. Export a backup before clearing browser data or making major changes.</p></div>`}
function modal(title,hint,body,saveLabel,saveFn){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><p class="hint">${hint||''}</p><form id="editForm">${body}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" type="submit">${saveLabel||'Save'}</button></div></form></section></div>`;document.getElementById('editForm').onsubmit=e=>{e.preventDefault();saveFn(new FormData(e.target));}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return `<label class="form-label">${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value??'')}" ${extra}>`}
function area(label,name,value=''){return `<label class="form-label">${label}</label><textarea class="field" name="${name}">${esc(value||'')}</textarea>`}
function selectField(label,name,options,value){return `<label class="form-label">${label}</label><select class="field" name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function openTask(id){const t=data.tasks.find(x=>x.id===id)||{title:'',due:'',status:'To do',priority:'Normal',notes:''};modal(id?'Edit task':'New task','Keep one next step per task.',field('Task','title',t.title,'text','required maxlength="140"')+`<div class="form-grid">${field('Due date','due',t.due,'date')}${selectField('Status','status',['To do','In progress','Done'],t.status)}</div>${selectField('Priority','priority',['Normal','High'],t.priority)}${area('Notes','notes',t.notes)}`, 'Save task',f=>{const v=Object.fromEntries(f);if(id)Object.assign(t,v);else data.tasks.push({id:nextId(data.tasks),...v});save();closeModal();render();toast('Task saved')})}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(t){t.status=t.status==='Done'?'To do':'Done';save();render()}}
function openSelection(id){const s=data.selections.find(x=>x.id===id)||{category:'',choice:'',area:'',status:'Considering',notes:''};modal(id?'Edit selection':'New selection','Record what you have chosen or still need to confirm.',field('Category','category',s.category,'text','required')+field('Choice / product','choice',s.choice,'text','required')+field('Room or area','area',s.area)+selectField('Status','status',['Considering','Shortlisted','Confirmed','Not proceeding'],s.status)+area('Notes','notes',s.notes),'Save selection',f=>{const v=Object.fromEntries(f);if(id)Object.assign(s,v);else data.selections.push({id:nextId(data.selections),...v});save();closeModal();render();toast('Selection saved')})}
function openExpense(id){const e=data.expenses.find(x=>x.id===id)||{title:'',amount:'',date:'',category:'Other',notes:''};modal(id?'Edit expense':'Record expense','Record a payment, deposit or invoice.',field('Description','title',e.title,'text','required')+field('Amount (AUD)','amount',e.amount,'number','required min="0" step="0.01"')+`<div class="form-grid">${field('Date','date',e.date,'date')}${selectField('Category','category',['Land','Builder','Variations','Professional fees','Utilities','Other'],e.category)}</div>`+area('Notes','notes',e.notes),'Save expense',f=>{const v=Object.fromEntries(f);v.amount=Number(v.amount);if(id)Object.assign(e,v);else data.expenses.push({id:nextId(data.expenses),...v});save();closeModal();render();toast('Expense saved')})}
function openBudget(){modal('Edit budget estimates','Change these estimates whenever your numbers change.',field('Land cost (AUD)','landCost',data.landCost,'number','required min="0" step="1"')+field('Builder contract (AUD)','builderCost',data.builderCost,'number','required min="0" step="1"')+field('Upgrades & variations allowance (AUD)','upgradeBudget',data.upgradeBudget,'number','required min="0" step="1"')+field('Other costs allowance (AUD)','otherBudget',data.otherBudget,'number','required min="0" step="1"'),'Save budget',f=>{for(const k of ['landCost','builderCost','upgradeBudget','otherBudget'])data[k]=Number(f.get(k)||0);save();closeModal();render();toast('Budget updated')})}
function openDocument(id){const d=data.documents.find(x=>x.id===id)||{title:'',kind:'Link',url:'',notes:''};modal(id?'Edit document reference':'Add document reference','Save a link to cloud storage or a short reference. Files remain wherever you store them.',field('Title','title',d.title,'text','required')+selectField('Type','kind',['Link','Quote','Contract','Plan / drawing','Receipt','Warranty','Other'],d.kind)+field('URL (optional)','url',d.url,'url')+area('Notes','notes',d.notes),'Save reference',f=>{const v=Object.fromEntries(f);if(id)Object.assign(d,v);else data.documents.push({id:nextId(data.documents),...v});save();closeModal();render();toast('Reference saved')})}
function saveProject(){data.projectName=document.getElementById('projectName').value.trim()||'The Hampton House';data.buildStage=document.getElementById('buildStage').value;save();render();toast('Project details saved')}
function saveNotes(){data.notes=document.getElementById('projectNotes').value;save();toast('Notes saved')}
function exportData(){const blob=new Blob([JSON.stringify({app:'The Hampton Edit',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hampton-edit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup export started')}
function importData(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result),incoming=obj.data||obj;if(!incoming||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.selections)||!Array.isArray(incoming.expenses))throw Error('Invalid backup');if(confirm('Replace the current project data with this backup? Export a backup first if you want to keep the current version.')){data={...defaults,...incoming};['tasks','selections','expenses','documents'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[]});save();render();toast('Backup imported')}}catch(e){alert('Could not import this file. Please choose a valid HomeBuild Companion JSON backup.')}ev.target.value=''};r.readAsText(file)}
function resetData(){if(confirm('Reset all saved project data in this browser? Export a backup first if you want to keep it.')){data=JSON.parse(JSON.stringify(defaults));save();view='Home';render();toast('Project data reset')}}
load();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
