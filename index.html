<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244c46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HomeBuild">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>HomeBuild Companion</title>
<style>
:root{--ink:#172a28;--muted:#71807d;--green:#244c46;--green2:#dcebe5;--paper:#f5f7f5;--line:#e3e9e5;--white:#fff;--amber:#fff0d7;--red:#fae4e0;--shadow:0 6px 24px #183e3510}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:92px}.top{padding:22px 20px 16px;background:linear-gradient(145deg,#e5eee9,#f7f8f5);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.logo{height:42px;width:42px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:23px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.top h1{font-size:22px;margin:4px 0 0;letter-spacing:-.5px}.greeting{margin-top:20px;font-size:14px;color:#51625e}.greeting strong{display:block;color:var(--ink);font-size:21px;margin-top:4px;letter-spacing:-.4px}.content{padding:18px 16px}.view-title{font-size:24px;margin:2px 4px 16px;letter-spacing:-.7px}.sub{color:var(--muted);font-size:13px;margin:-9px 4px 18px}.hero{background:var(--green);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"⌂";position:absolute;right:12px;top:-28px;font-size:130px;color:#ffffff0c}.hero .eyebrow{color:#c9ddd5}.hero h2{font-size:23px;margin:9px 0 5px;letter-spacing:-.6px}.hero p{color:#d9e7e1;margin:0;font-size:13px;line-height:1.5}.progress-track{height:7px;border-radius:20px;background:#ffffff32;margin:18px 0 8px;overflow:hidden}.progress-fill{height:100%;background:#d4e8a9;border-radius:20px;transition:width .2s}.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:#e1ede8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}.stat,.card{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.stat .icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--green2);font-size:17px;margin-bottom:12px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:20px;font-weight:750;letter-spacing:-.5px;margin-top:4px;overflow-wrap:anywhere}.stat .note{font-size:11px;color:var(--muted);margin-top:4px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 3px 11px}.section-head h3{margin:0;font-size:16px}.text-btn{border:0;background:none;color:var(--green);font-weight:700;padding:7px}.row-item{display:flex;gap:12px;align-items:center;background:white;border:1px solid var(--line);padding:13px;border-radius:14px;margin-bottom:8px}.row-item .item-main{flex:1;min-width:0}.row-item strong{display:block;font-size:14px}.row-item small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}.amount{font-weight:700;white-space:nowrap;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:30px;background:#edf1ee;color:#56645f;font-size:11px;font-weight:700}.pill.done{background:var(--green2);color:var(--green)}.pill.high{background:var(--amber);color:#8b5c11}.pill.overdue{background:var(--red);color:#9a3e32}.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 8px max(10px,env(safe-area-inset-bottom));background:#fffffff0;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:100%;max-width:760px;display:flex;justify-content:space-around}.nav-btn{border:0;background:transparent;color:#7a8782;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px;padding:4px 7px;border-radius:12px}.nav-btn .nav-icon{font-size:20px}.nav-btn.active{color:var(--green);background:#eaf1ed}.primary{border:0;background:var(--green);color:white;font-weight:700;padding:13px 16px;border-radius:13px;width:100%;box-shadow:0 4px 10px #244c4620}.secondary{border:1px solid var(--line);background:white;color:var(--green);font-weight:650;padding:11px 14px;border-radius:12px}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 13px}.filter{border:1px solid var(--line);background:white;border-radius:30px;padding:8px 12px;font-size:12px;white-space:nowrap;color:#52615c}.filter.active{background:var(--green);border-color:var(--green);color:white}.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;background:white;border:1px dashed #cfd9d3;border-radius:15px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.selection-swatch{width:38px;height:38px;border-radius:12px;background:#e9e1d2;display:grid;place-items:center;font-size:18px;flex-shrink:0}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:white;margin-bottom:12px;outline-color:var(--green)}.card{margin-bottom:12px}.card h3{margin:0 0 10px;font-size:15px}.budget-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}.budget-line:last-child{border:0}.budget-line span:first-child{color:#52615c}.form-label{display:block;font-size:12px;color:#52615c;font-weight:700;margin:13px 0 6px}.field{width:100%;padding:12px;border:1px solid #dce4df;border-radius:11px;background:#fff;outline-color:var(--green)}textarea.field{min-height:80px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-back{position:fixed;inset:0;background:#0b211dc0;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:92dvh;overflow:auto;padding:22px 20px max(24px,env(safe-area-inset-bottom))}.modal h2{margin:0 0 5px;font-size:21px}.modal .hint{color:var(--muted);font-size:13px;margin:0 0 15px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.tiny{font-size:11px;color:var(--muted);line-height:1.5}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.danger{color:#a23f34;border-color:#f0d4d0}.toast{position:fixed;z-index:40;bottom:100px;left:50%;transform:translateX(-50%);background:#172a28;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);max-width:90%;text-align:center}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.settings-row:last-child{border-bottom:0}.settings-row strong{font-size:14px}.settings-row p{margin:4px 0 0;color:var(--muted);font-size:12px}.hidden{display:none!important}@media(min-width:600px){.content{padding:24px}.top{padding:25px 28px}.modal-back{align-items:center}.modal{border-radius:24px;padding-bottom:24px}.hero{padding:25px}.stat{padding:19px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">⌂</div><div><div class="eyebrow">Your project, in one place</div><h1>HomeBuild Companion</h1></div></div>
 <div class="greeting">A calmer way to manage your build.<strong id="projectNameDisplay">Our New Home</strong></div>
</header>
<main id="main" class="content"></main>
</div>
<nav class="bottom-nav"><div class="nav-inner" id="nav"></div></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORE='homebuild-companion-v1';
const defaults={
 projectName:'Our New Home',landCost:562000,builderCost:367405,upgradeBudget:48295,otherBudget:22500,buildStage:'Planning & selections',
 tasks:[
 {id:1,title:'Confirm kitchen cabinetry and drawer layout',due:'',status:'To do',priority:'High',notes:'Confirm drawer configuration before contracts are finalised.'},
 {id:2,title:'Send remaining questions to builder',due:'',status:'To do',priority:'Normal',notes:''},
 {id:3,title:'Review land contract and retaining wall disclosure',due:'',status:'In progress',priority:'High',notes:''}
 ],
 selections:[
 {id:1,category:'Bricks',choice:'PGH Washed White',area:'Exterior',status:'Considering',notes:''},
 {id:2,category:'Roof',choice:'Dover White',area:'Exterior',status:'Considering',notes:''},
 {id:3,category:'Gutters',choice:'Surfmist',area:'Exterior',status:'Considering',notes:''},
 {id:4,category:'Kitchen cabinetry',choice:'Boston Oak / White Cotton',area:'Kitchen',status:'Considering',notes:'Confirm drawer layout.'},
 {id:5,category:'Tapware',choice:'Matte black',area:'Bathrooms',status:'Considering',notes:'Compare durability and cleaning.'},
 {id:6,category:'Flooring',choice:'Blonde oak hybrid',area:'Interior',status:'Considering',notes:''}
 ],
 expenses:[
 {id:1,title:'Land deposit',amount:20000,date:'',category:'Land',notes:'Paid'},
 {id:2,title:'Builder initial deposit',amount:2500,date:'',category:'Builder',notes:'Paid'}
 ],
 documents:[],
 notes:''
};
let data, view='Home', taskFilter='All', selectionFilter='All', expenseFilter='All';
function load(){try{let saved=JSON.parse(localStorage.getItem(STORE));data=saved&&saved.version===1?saved.data:structuredClone(defaults)}catch(e){data=JSON.parse(JSON.stringify(defaults))} if(!data.tasks)data.tasks=[];if(!data.selections)data.selections=[];if(!data.expenses)data.expenses=[];if(!data.documents)data.documents=[]}
function save(){localStorage.setItem(STORE,JSON.stringify({version:1,data}));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Number(n)||0)}
function fmtDate(d){if(!d)return 'No date set';return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}
function nextId(arr){return Math.max(0,...arr.map(x=>Number(x.id)||0))+1}
function tasksOpen(){return data.tasks.filter(t=>t.status!=='Done').length}
function budgetTotal(){return Number(data.landCost)+Number(data.builderCost)+Number(data.upgradeBudget)+Number(data.otherBudget)}
function expensesTotal(){return data.expenses.reduce((a,e)=>a+Number(e.amount||0),0)}
function toast(msg){let el=document.getElementById('toastRoot');el.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>el.innerHTML='',2400)}
const navItems=[['Home','⌂'],['Budget','$'],['Selections','◇'],['Tasks','☷'],['More','•••']];
function navRender(){document.getElementById('nav').innerHTML=navItems.map(([n,i])=>`<button class="nav-btn ${view===n?'active':''}" onclick="go('${n}')"><span class="nav-icon">${i}</span>${n}</button>`).join('')}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){navRender();let m=document.getElementById('main');if(view==='Home')m.innerHTML=homeView();else if(view==='Budget')m.innerHTML=budgetView();else if(view==='Selections')m.innerHTML=selectionsView();else if(view==='Tasks')m.innerHTML=tasksView();else m.innerHTML=moreView();document.getElementById('projectNameDisplay').textContent=data.projectName||'Our New Home'}
function homeView(){let done=data.tasks.filter(t=>t.status==='Done').length, pct=data.tasks.length?Math.round(done/data.tasks.length*100):0;let upcoming=data.tasks.filter(t=>t.status!=='Done').slice(0,3);return `
 <section class="hero"><div class="eyebrow">BUILD OVERVIEW</div><h2>${esc(data.projectName||'Our New Home')}</h2><p>One organised place for the decisions, costs and little details that make a house a home.</p><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-meta"><span>${done} of ${data.tasks.length} tasks completed</span><strong>${pct}%</strong></div></section>
 <div class="grid">
 <div class="stat"><div class="icon">⌂</div><div class="label">Estimated total project budget</div><div class="value">${money(budgetTotal())}</div><div class="note">Land + build + allowances</div></div>
 <div class="stat"><div class="icon">↗</div><div class="label">Expenses recorded</div><div class="value">${money(expensesTotal())}</div><div class="note">${data.expenses.length} recorded payments</div></div>
 <div class="stat"><div class="icon">☷</div><div class="label">Open tasks</div><div class="value">${tasksOpen()}</div><div class="note">Keep the next steps moving</div></div>
 <div class="stat"><div class="icon">◇</div><div class="label">Selections tracked</div><div class="value">${data.selections.length}</div><div class="note">${data.selections.filter(s=>s.status==='Confirmed').length} confirmed so far</div></div></div>
 <div class="section-head"><h3>Next up</h3><button class="text-btn" onclick="go('Tasks')">All tasks →</button></div>
 ${upcoming.length?upcoming.map(taskRow).join(''):'<div class="empty"><strong>All caught up</strong>Add a task when there is something to do.</div>'}
 <div class="section-head"><h3>Quick actions</h3></div><div class="grid"><button class="secondary" onclick="openTask()">＋ Add a task</button><button class="secondary" onclick="openExpense()">＋ Record expense</button><button class="secondary" onclick="openSelection()">＋ Add selection</button><button class="secondary" onclick="go('More')">▤ Notes & documents</button></div>
 <p class="tiny" style="margin:18px 4px 0">Your information is saved in this browser on this device. Use More → Backup to export a copy.</p>`}
function taskRow(t){let p=t.priority==='High'?'<span class="pill high">High priority</span>':`<span class="pill">${esc(t.status)}</span>`;return `<div class="row-item"><button aria-label="Mark task done" class="check" style="border:1.5px solid #b9c8c0;background:${t.status==='Done'?'#244c46':'white'};color:white;border-radius:50%;width:24px;height:24px;flex-shrink:0" onclick="toggleTask(${t.id})">${t.status==='Done'?'✓':''}</button><div class="item-main" onclick="openTask(${t.id})"><strong style="${t.status==='Done'?'text-decoration:line-through;color:#81908a':''}">${esc(t.title)}</strong><small>${t.due?'Due '+fmtDate(t.due)+' · ':''}${esc(t.status)}${t.notes?' · '+esc(t.notes):''}</small></div>${p}</div>`}
function budgetView(){let total=budgetTotal(),paid=expensesTotal(),items=[['Land',data.landCost],['Builder contract',data.builderCost],['Upgrades & variations allowance',data.upgradeBudget],['Other costs allowance',data.otherBudget]];return `<h2 class="view-title">Budget</h2><p class="sub">Keep your project costs visible as decisions change.</p><div class="hero"><div class="eyebrow">ESTIMATED TOTAL PROJECT BUDGET</div><h2>${money(total)}</h2><p>Recorded expenses: ${money(paid)} · Remaining against estimate: ${money(total-paid)}</p></div><div class="section-head"><h3>Budget breakdown</h3><button class="text-btn" onclick="openBudget()">Edit</button></div><div class="card">${items.map(([n,v])=>`<div class="budget-line"><span>${esc(n)}</span><strong>${money(v)}</strong></div>`).join('')}<div class="budget-line"><strong>Total estimate</strong><strong>${money(total)}</strong></div></div><div class="section-head"><h3>Recorded expenses</h3><button class="text-btn" onclick="openExpense()">＋ Add</button></div>${data.expenses.length?data.expenses.slice().reverse().map(e=>`<div class="row-item"><div class="selection-swatch">＄</div><div class="item-main"><strong>${esc(e.title)}</strong><small>${esc(e.category)} · ${e.date?fmtDate(e.date):'Date not set'}${e.notes?' · '+esc(e.notes):''}</small></div><div class="amount">${money(e.amount)}</div><button class="text-btn" aria-label="Edit expense" onclick="openExpense(${e.id})">···</button></div>`).join(''):'<div class="empty"><strong>No expenses yet</strong>Record deposits, invoices and other payments to track spending.</div>'}<p class="tiny">Budget figures are editable estimates, not financial advice. “Expenses recorded” is the sum of entries you add; it does not automatically reconcile against the budget.</p>`}
function selectionsView(){let cats=['All',...new Set(data.selections.map(s=>s.category).filter(Boolean))];return `<h2 class="view-title">Selections</h2><p class="sub">Colours, finishes and inclusions — all in one place.</p><div class="filters">${cats.map(c=>`<button class="filter ${selectionFilter===c?'active':''}" onclick="selectionFilter='${esc(c).replace(/'/g,"\\'")}';render()">${esc(c)}</button>`).join('')}</div>${data.selections.filter(s=>selectionFilter==='All'||s.category===selectionFilter).map(s=>`<div class="row-item"><div class="selection-swatch">◇</div><div class="item-main"><strong>${esc(s.category)} · ${esc(s.choice)}</strong><small>${esc(s.area||'General')}${s.notes?' · '+esc(s.notes):''}</small><span class="pill ${s.status==='Confirmed'?'done':''}" style="margin-top:7px">${esc(s.status)}</span></div><button class="text-btn" onclick="openSelection(${s.id})">Edit</button></div>`).join('')||'<div class="empty"><strong>No selections in this view</strong>Add a selection to keep track of your decisions.</div>'}<button class="primary" onclick="openSelection()" style="margin-top:10px">＋ Add selection</button>`}
function tasksView(){let fs=['All','To do','In progress','Done'];return `<h2 class="view-title">Tasks</h2><p class="sub">Builder questions, decisions and deadlines.</p><div class="filters">${fs.map(f=>`<button class="filter ${taskFilter===f?'active':''}" onclick="taskFilter='${f}';render()">${f}</button>`).join('')}</div>${data.tasks.filter(t=>taskFilter==='All'||t.status===taskFilter).sort((a,b)=>(a.status==='Done')-(b.status==='Done')).map(taskRow).join('')||'<div class="empty"><strong>Nothing here</strong>Add a task or switch the filter.</div>'}<button class="primary" onclick="openTask()" style="margin-top:10px">＋ Add task</button>`}
function moreView(){return `<h2 class="view-title">More</h2><p class="sub">Project details, documents, notes and data backup.</p><div class="card"><h3>Project details</h3><label class="form-label">Project name</label><input class="field" id="projectName" value="${esc(data.projectName)}" maxlength="70"><label class="form-label">Current stage</label><select class="field" id="buildStage"><option ${data.buildStage==='Planning & selections'?'selected':''}>Planning & selections</option><option ${data.buildStage==='Contracts'?'selected':''}>Contracts</option><option ${data.buildStage==='Pre-construction'?'selected':''}>Pre-construction</option><option ${data.buildStage==='Construction'?'selected':''}>Construction</option><option ${data.buildStage==='Handover'?'selected':''}>Handover</option><option ${data.buildStage==='Complete'?'selected':''}>Complete</option></select><button class="primary" style="margin-top:14px" onclick="saveProject()">Save project details</button></div><div class="section-head"><h3>Notes</h3></div><div class="card"><textarea class="field" id="projectNotes" placeholder="Site notes, questions, ideas, phone call summaries...">${esc(data.notes||'')}</textarea><button class="primary" style="margin-top:10px" onclick="saveNotes()">Save notes</button></div><div class="section-head"><h3>Documents & links</h3><button class="text-btn" onclick="openDocument()">＋ Add</button></div>${data.documents.length?data.documents.map(d=>`<div class="row-item"><div class="selection-swatch">▤</div><div class="item-main"><strong>${esc(d.title)}</strong><small>${esc(d.kind||'Link or note')}${d.notes?' · '+esc(d.notes):''}</small>${d.url?`<small><a href="${esc(d.url)}" target="_blank" rel="noopener">Open link ↗</a></small>`:''}</div><button class="text-btn" onclick="openDocument(${d.id})">Edit</button></div>`).join(''):'<div class="empty"><strong>No documents saved</strong>Add a cloud file link, quote reference or note. This app does not upload files.</div>'}<div class="section-head"><h3>Data & privacy</h3></div><div class="card"><div class="settings-row"><div><strong>Export backup</strong><p>Download your project data as a JSON file.</p></div><button class="secondary" onclick="exportData()">Export</button></div><div class="settings-row"><div><strong>Import backup</strong><p>Restore a previous JSON backup.</p></div><button class="secondary" onclick="document.getElementById('importFile').click()">Import</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"></div><div class="settings-row"><div><strong>Reset sample data</strong><p>Replace this project with the starter example.</p></div><button class="secondary danger" onclick="resetData()">Reset</button></div><p class="tiny">Data stays in this browser's local storage. It is not automatically synced to another device. Export backups regularly. Avoid storing passwords or highly sensitive personal information.</p></div>`}
function modal(title,hint,body,saveLabel,saveFn){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><p class="hint">${hint||''}</p><form id="editForm">${body}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" type="submit">${saveLabel||'Save'}</button></div></form></section></div>`;document.getElementById('editForm').onsubmit=e=>{e.preventDefault();saveFn(new FormData(e.target));};}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return `<label class="form-label">${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value??'')}" ${extra}>`}
function area(label,name,value=''){return `<label class="form-label">${label}</label><textarea class="field" name="${name}">${esc(value||'')}</textarea>`}
function selectField(label,name,options,value){return `<label class="form-label">${label}</label><select class="field" name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function openTask(id){let t=data.tasks.find(x=>x.id===id)||{title:'',due:'',status:'To do',priority:'Normal',notes:''};modal(id?'Edit task':'New task','Keep one next step per task.',field('Task','title',t.title,'text','required maxlength="140"')+`<div class="form-grid">${field('Due date','due',t.due,'date')}${selectField('Status','status',['To do','In progress','Done'],t.status)}</div>${selectField('Priority','priority',['Normal','High'],t.priority)}${area('Notes','notes',t.notes)}`, 'Save task',f=>{let v=Object.fromEntries(f);if(id)Object.assign(t,v);else data.tasks.push({id:nextId(data.tasks),...v});save();closeModal();render();toast('Task saved')})}
function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t){t.status=t.status==='Done'?'To do':'Done';save();render();}}
function openSelection(id){let s=data.selections.find(x=>x.id===id)||{category:'',choice:'',area:'',status:'Considering',notes:''};modal(id?'Edit selection':'New selection','Record what you have chosen or still need to confirm.',field('Category','category',s.category,'text','required')+field('Choice / product','choice',s.choice,'text','required')+field('Room or area','area',s.area)+selectField('Status','status',['Considering','Shortlisted','Confirmed','Not proceeding'],s.status)+area('Notes','notes',s.notes), 'Save selection',f=>{let v=Object.fromEntries(f);if(id)Object.assign(s,v);else data.selections.push({id:nextId(data.selections),...v});save();closeModal();render();toast('Selection saved')})}
function openExpense(id){let e=data.expenses.find(x=>x.id===id)||{title:'',amount:'',date:'',category:'Other',notes:''};modal(id?'Edit expense':'Record expense','Record a payment, deposit or invoice.',field('Description','title',e.title,'text','required')+field('Amount (AUD)','amount',e.amount,'number','required min="0" step="0.01"')+`<div class="form-grid">${field('Date','date',e.date,'date')}${selectField('Category','category',['Land','Builder','Variations','Professional fees','Utilities','Other'],e.category)}</div>`+area('Notes','notes',e.notes), 'Save expense',f=>{let v=Object.fromEntries(f);v.amount=Number(v.amount);if(id)Object.assign(e,v);else data.expenses.push({id:nextId(data.expenses),...v});save();closeModal();render();toast('Expense saved')})}
function openBudget(){modal('Edit budget estimates','Change these estimates whenever your numbers change.',field('Land cost (AUD)','landCost',data.landCost,'number','required min="0" step="1"')+field('Builder contract (AUD)','builderCost',data.builderCost,'number','required min="0" step="1"')+field('Upgrades & variations allowance (AUD)','upgradeBudget',data.upgradeBudget,'number','required min="0" step="1"')+field('Other costs allowance (AUD)','otherBudget',data.otherBudget,'number','required min="0" step="1"'),'Save budget',f=>{for(let k of ['landCost','builderCost','upgradeBudget','otherBudget'])data[k]=Number(f.get(k)||0);save();closeModal();render();toast('Budget updated')})}
function openDocument(id){let d=data.documents.find(x=>x.id===id)||{title:'',kind:'Link',url:'',notes:''};modal(id?'Edit document reference':'Add document reference','Save a link to cloud storage or a short reference. Files remain wherever you store them.',field('Title','title',d.title,'text','required')+selectField('Type','kind',['Link','Quote','Contract','Plan / drawing','Receipt','Warranty','Other'],d.kind)+field('URL (optional)','url',d.url,'url')+area('Notes','notes',d.notes),'Save reference',f=>{let v=Object.fromEntries(f);if(id)Object.assign(d,v);else data.documents.push({id:nextId(data.documents),...v});save();closeModal();render();toast('Reference saved')})}
function saveProject(){data.projectName=document.getElementById('projectName').value.trim()||'Our New Home';data.buildStage=document.getElementById('buildStage').value;save();render();toast('Project details saved')}
function saveNotes(){data.notes=document.getElementById('projectNotes').value;save();toast('Notes saved')}
function exportData(){let blob=new Blob([JSON.stringify({app:'HomeBuild Companion',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='homebuild-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup export started')}
function importData(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);let incoming=obj.data||obj;if(!incoming.tasks||!incoming.selections||!incoming.expenses)throw Error('Invalid backup');if(confirm('Replace current project data with this backup?')){data=incoming;save();render();toast('Backup imported')}}catch(e){alert('Could not import this file. Please select a HomeBuild Companion JSON backup.')}ev.target.value=''};r.readAsText(file)}
function resetData(){if(confirm('Reset all current app data to the sample project? Export a backup first if you need to keep it.')){data=JSON.parse(JSON.stringify(defaults));save();view='Home';render();toast('Sample project restored')}}
load();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
